name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm alphabetic-code-generator.spec
      - run: Compress-Archive -Path dist/alphabetic-code-generator.exe -DestinationPath alphabetic-code-generator-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alphabetic-code-generator-windows
          path: alphabetic-code-generator-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: alphabetic-code-generator-windows.zip
